<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d" font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif">
  <title id="t">Shopify Development Skill for AI Agents</title>
  <desc id="d">The entire shopify.dev reference — Liquid, themes, apps, Hydrogen, Functions — as an installable skill for Claude Code, Amp and Cursor. 18 chapters, 648 pages, 1:1 verbatim.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#0C1426"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7A8"/>
      <stop offset="0.55" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" fill-opacity="0.03"/>
    </pattern>
    <clipPath id="panel"><rect x="0" y="0" width="1200" height="420" rx="24"/></clipPath>
    <clipPath id="card"><rect x="664" y="56" width="464" height="308" rx="14"/></clipPath>
  </defs>

  <!-- ===== PANEL ===== -->
  <g clip-path="url(#panel)">
    <rect x="0" y="0" width="1200" height="420" fill="url(#bg)"/>
    <rect x="0" y="0" width="1200" height="420" fill="url(#dots)"/>
    <ellipse cx="150" cy="40" rx="460" ry="320" fill="url(#glow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="0" y="0" width="1200" height="3" fill="url(#topline)"/>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- ===== LEFT COLUMN (left margin = 72) ===== -->

  <!-- eyebrow pill -->
  <rect x="72" y="52" width="372" height="30" rx="15" fill="#10B981" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.35"/>
  <circle cx="94" cy="67" r="4" fill="#34D399">
    <animate attributeName="fill-opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="120" y="71" textLength="300" lengthAdjust="spacing" font-size="11" font-weight="600" fill="#A7F3D0">CLAUDE CODE · AMP · CURSOR · AI AGENTS</text>

  <!-- headline -->
  <text x="72" y="150" font-size="48" font-weight="800" letter-spacing="-1" fill="#F8FAFC">Shopify Development</text>
  <text x="72" y="204" font-size="48" font-weight="800" letter-spacing="-1" fill="url(#emerald)">Skill for AI Agents</text>

  <!-- subtitle -->
  <text x="72" y="248" font-size="17" fill="#94A3B8">The entire <tspan fill="#E2E8F0" font-weight="600">shopify.dev</tspan> reference — Liquid, themes, apps,</text>
  <text x="72" y="274" font-size="17" fill="#94A3B8">Hydrogen, Functions — your agent <tspan fill="#A7F3D0" font-weight="600">looks up, never guesses.</tspan></text>

  <!-- stat chips -->
  <g font-size="13" font-weight="700">
    <g transform="translate(72,308)">
      <rect width="116" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="16" y="21" fill="#34D399">18</text><text x="38" y="21" fill="#CBD5E1" font-weight="500">chapters</text>
    </g>
    <g transform="translate(200,308)">
      <rect width="104" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="16" y="21" fill="#34D399">648</text><text x="50" y="21" fill="#CBD5E1" font-weight="500">pages</text>
    </g>
    <g transform="translate(316,308)">
      <rect width="124" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="16" y="21" fill="#34D399">1:1</text><text x="44" y="21" fill="#CBD5E1" font-weight="500">verbatim</text>
    </g>
  </g>
  <text x="72" y="372" font-size="12.5" fill="#64748B">135 objects · 155 filters · 28 tags · indexed for instant lookup</text>

  <!-- ===== RIGHT COLUMN: code card ===== -->
  <g clip-path="url(#card)">
    <rect x="664" y="56" width="464" height="308" fill="#070B16"/>
    <rect x="664" y="56" width="464" height="40" fill="#FFFFFF" fill-opacity="0.04"/>
    <rect x="664" y="324" width="464" height="40" fill="#10B981" fill-opacity="0.08"/>
  </g>
  <rect x="664" y="56" width="464" height="308" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- title bar -->
  <circle cx="688" cy="76" r="5" fill="#FF5F56"/>
  <circle cx="708" cy="76" r="5" fill="#FFBD2E"/>
  <circle cx="728" cy="76" r="5" fill="#27C93F"/>
  <text x="896" y="80" text-anchor="middle" font-size="12" fill="#64748B" font-family="'SFMono-Regular',Menlo,Consolas,monospace">shopify-development · SKILL.md</text>

  <!-- code -->
  <g font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="14">
    <text x="688" y="124" fill="#475569">// agent task</text>
    <text x="688" y="152"><tspan fill="#34D399">agent</tspan><tspan fill="#475569"> ▸ </tspan><tspan fill="#FBBF24">"build a product card"</tspan></text>

    <text x="688" y="192" fill="#A7F3D0">{% schema %}</text>
    <text x="708" y="218"><tspan fill="#7DD3FC">"type"</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#FBBF24">"image_picker"</tspan></text>
    <text x="708" y="244"><tspan fill="#7DD3FC">"type"</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#FBBF24">"color_scheme"</tspan></text>
    <text x="688" y="270" fill="#A7F3D0">{% endschema %}</text>

    <text x="688" y="308" fill="#E2E8F0">{{ product.price <tspan fill="#34D399">| money</tspan> }}<tspan fill="#34D399" font-weight="700"> ▋<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <!-- footer -->
  <text x="688" y="349" font-size="12.5" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#34D399">✓ verbatim — traceable to shopify.dev</text>
</svg>
