<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <title id="t">Shopify Development Skill for AI Agents</title>
  <desc id="d">The entire shopify.dev reference — Liquid, themes, apps, Hydrogen, Functions — as an installable skill for Claude Code, Amp and Cursor. 18 chapters, 648 pages, 1:1 verbatim.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#0C1426"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DE08D"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#FFFFFF" fill-opacity="0.035"/>
    </pattern>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="420" rx="24" fill="url(#dots)"/>
  <ellipse cx="180" cy="60" rx="420" ry="300" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#line)"/>

  <!-- ===== LEFT: copy ===== -->
  <!-- eyebrow pill -->
  <g transform="translate(64,70)">
    <rect x="0" y="0" width="318" height="30" rx="15" fill="#10B981" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.35"/>
    <circle cx="20" cy="15" r="4" fill="#34D399">
      <animate attributeName="fill-opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="20" font-size="12.5" letter-spacing="2.5" font-weight="600" fill="#A7F3D0">CLAUDE CODE · AMP · CURSOR · AI AGENTS</text>
  </g>

  <!-- headline -->
  <text x="62" y="172" font-size="54" font-weight="800" fill="#F8FAFC" letter-spacing="-1">Shopify Development</text>
  <text x="62" y="230" font-size="54" font-weight="800" fill="url(#emerald)" letter-spacing="-1">Skill for AI Agents</text>

  <!-- subtitle -->
  <text x="64" y="276" font-size="17.5" fill="#94A3B8">The entire <tspan fill="#E2E8F0" font-weight="600">shopify.dev</tspan> reference — Liquid, themes, apps,</text>
  <text x="64" y="302" font-size="17.5" fill="#94A3B8">Hydrogen, Functions — your agent <tspan fill="#A7F3D0" font-weight="600">looks up, never guesses.</tspan></text>

  <!-- stat chips -->
  <g transform="translate(64,332)" font-size="13" font-weight="600">
    <g>
      <rect x="0" y="0" width="116" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="14" y="20" fill="#34D399">18</text><text x="36" y="20" fill="#CBD5E1">chapters</text>
    </g>
    <g transform="translate(128,0)">
      <rect x="0" y="0" width="120" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="14" y="20" fill="#34D399">648</text><text x="44" y="20" fill="#CBD5E1">pages</text>
    </g>
    <g transform="translate(260,0)">
      <rect x="0" y="0" width="138" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="14" y="20" fill="#34D399">1:1</text><text x="42" y="20" fill="#CBD5E1">verbatim</text>
    </g>
  </g>
  <text x="64" y="392" font-size="12.5" fill="#64748B">135 objects · 155 filters · 28 tags · indexed for instant lookup</text>

  <!-- ===== RIGHT: code card ===== -->
  <g transform="translate(704,64)">
    <rect x="0" y="0" width="432" height="292" rx="14" fill="#070B16" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <!-- title bar -->
    <rect x="0" y="0" width="432" height="38" rx="14" fill="#FFFFFF" fill-opacity="0.04"/>
    <rect x="0" y="24" width="432" height="14" fill="#070B16"/>
    <circle cx="22" cy="19" r="5" fill="#FF5F56"/>
    <circle cx="42" cy="19" r="5" fill="#FFBD2E"/>
    <circle cx="62" cy="19" r="5" fill="#27C93F"/>
    <text x="216" y="23" text-anchor="middle" font-size="12" fill="#64748B" font-family="'SFMono-Regular',Menlo,Consolas,monospace">shopify-development · SKILL.md</text>

    <!-- code -->
    <g font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="14.5">
      <text x="24" y="74" fill="#475569">// agent task</text>
      <text x="24" y="100" fill="#94A3B8"><tspan fill="#34D399">agent</tspan> <tspan fill="#475569">▸</tspan> <tspan fill="#FBBF24">"build a product card section"</tspan></text>

      <text x="24" y="138" fill="#A7F3D0">{% schema %}</text>
      <text x="44" y="162" fill="#E2E8F0"><tspan fill="#7DD3FC">"type"</tspan>: <tspan fill="#FBBF24">"image_picker"</tspan></text>
      <text x="44" y="186" fill="#E2E8F0"><tspan fill="#7DD3FC">"type"</tspan>: <tspan fill="#FBBF24">"color_scheme"</tspan></text>
      <text x="24" y="210" fill="#A7F3D0">{% endschema %}</text>

      <text x="24" y="244" fill="#E2E8F0">{{ product.price <tspan fill="#34D399">| money</tspan> }}<tspan fill="#34D399" font-weight="700"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/> ▋</tspan></text>
    </g>

    <!-- verified footer -->
    <rect x="0" y="254" width="432" height="38" rx="14" fill="#10B981" fill-opacity="0.08"/>
    <rect x="0" y="254" width="432" height="14" fill="#070B16"/>
    <text x="24" y="279" font-size="13" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#34D399">✓ verbatim from shopify.dev — traceable, never hallucinated</text>
  </g>
</svg>
