<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" fill="none" role="img" aria-label="An AI agent looking up the exact Shopify reference: a terminal showing a Liquid lookup surrounded by indexed tags">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset=".5" stop-color="#B14DF9"/>
      <stop offset="1" stop-color="#9EF85B"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EE0A0"/>
      <stop offset="1" stop-color="#3AD6C5"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f33"/>
      <stop offset="1" stop-color="#11142480"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- gradient orbs -->
  <circle cx="170" cy="150" r="150" fill="#7C5CFF" opacity="0.55" filter="url(#blur)"/>
  <circle cx="560" cy="430" r="160" fill="#3AD6C5" opacity="0.40" filter="url(#blur)"/>
  <circle cx="540" cy="120" r="120" fill="#9EF85B" opacity="0.30" filter="url(#blur)"/>

  <!-- main terminal card -->
  <g filter="url(#soft)">
    <rect x="96" y="120" width="528" height="320" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
    <!-- title bar -->
    <rect x="96" y="120" width="528" height="44" rx="22" fill="#ffffff" fill-opacity="0.03"/>
    <circle cx="124" cy="142" r="6" fill="#ff5f57"/>
    <circle cx="146" cy="142" r="6" fill="#febc2e"/>
    <circle cx="168" cy="142" r="6" fill="#28c840"/>
    <rect x="300" y="135" width="120" height="14" rx="7" fill="#ffffff" fill-opacity="0.08"/>

    <!-- prompt line -->
    <text x="124" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#9EF85B">agent ▸</text>
    <text x="186" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#cdd3e6">how do I format a price in Liquid?</text>

    <!-- lookup line -->
    <text x="124" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#7C8299">grep</text>
    <text x="162" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#B14DF9">"## money — money_with_currency"</text>

    <!-- result block -->
    <rect x="120" y="262" width="480" height="150" rx="12" fill="#0b0e1a" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="138" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#5EE0A0">reference/10-liquid-filters-part2.md</text>
    <text x="138" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#e8eaf2">{{ </text>
    <text x="166" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9EF85B">product.price</text>
    <text x="262" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#e8eaf2">| </text>
    <text x="278" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#B14DF9">money_with_currency</text>
    <text x="446" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#e8eaf2"> }}</text>
    <text x="138" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#7C8299">→ "$1,134.00 USD"  ·  verbatim, not guessed</text>
    <rect x="138" y="366" width="300" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="138" y="384" width="210" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.05"/>
  </g>

  <!-- floating pills -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">
    <g filter="url(#soft)">
      <rect x="40" y="330" width="118" height="38" rx="19" fill="#141828" stroke="url(#g1)" stroke-opacity="0.6"/>
      <text x="64" y="354" fill="#cdd3e6">product</text>
    </g>
    <g filter="url(#soft)">
      <rect x="556" y="250" width="138" height="38" rx="19" fill="#141828" stroke="url(#g2)" stroke-opacity="0.7"/>
      <text x="576" y="274" fill="#cdd3e6">{% schema %}</text>
    </g>
    <g filter="url(#soft)">
      <rect x="500" y="470" width="120" height="38" rx="19" fill="#141828" stroke="url(#g1)" stroke-opacity="0.6"/>
      <text x="522" y="494" fill="#cdd3e6">cart.js</text>
    </g>
    <g filter="url(#soft)">
      <rect x="92" y="60" width="150" height="38" rx="19" fill="#141828" stroke="url(#g1)" stroke-opacity="0.6"/>
      <text x="114" y="84" fill="#cdd3e6">135 objects</text>
    </g>
  </g>

  <!-- up arrow brand mark -->
  <g transform="translate(330,470)">
    <rect width="60" height="60" rx="16" fill="url(#g1)"/>
    <path d="M30 18 L44 38 H36 V46 H24 V38 H16 Z" fill="#0b0e1a"/>
  </g>
</svg>
